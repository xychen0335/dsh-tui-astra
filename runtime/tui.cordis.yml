# dsh-tui-astra runtime composition: an interactive coding agent served to
# the TUI over stdio JSON-RPC. stdout is reserved for JSON-RPC; do not add a
# console logger or terminal UI.
#
# Environment:
#   DEEPSEEK_API_KEY    credential for the DeepSeek endpoint
#   DEEPSEEK_BASE_URL   optional endpoint override
#   DSH_PROVIDER        provider route (deepseek-official or a custom route)
#   DSH_MODEL           model id
#   DSH_BASE_URL        custom provider endpoint
#   DSH_API_KEY_ENV     credential environment-variable name
#   DSH_API             custom provider wire protocol
#   DSH_CWD             agent workspace for bash and filesystem tools
#   DSH_SESSION_ROOT    JSONL session directory (entry defaults to ~/.dsh/sessions)
#   DSH_SYSTEM_PROMPT   optional persona override
#   DSH_MODEL           optional default model

- id: sdk-jsonrpc-server
  name: '../lib/runtime-server.js'

- id: commands
  name: '@deepseek-ai/dsh-commands'

- id: settings
  name: '@deepseek-ai/dsh-settings-file'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: runtime-provider
  name: '../lib/runtime-provider.js'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 120000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a helpful software engineering assistant running in a terminal UI. Work in the provided workspace directory, prefer focused edits, and keep answers concise.'
    workspaceContext:
      maxBytes: 8192
      projectRootMarkers: ['.git', 'README.md']
    skills:
      enabled: true
    goals: {}
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: plan-mode
  name: '@deepseek-ai/dsh-plan-mode'
  config:
    section: |
      You are in plan mode. Inspect the workspace and resolve discoverable
      facts before proposing changes. Do not modify files or run destructive
      commands. Present a concise, decision-complete implementation plan.

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? ((process.env.DSH_HOME ?? ((process.env.HOME ?? process.cwd()) + '/.dsh')) + '/sessions')

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

- id: command-compact
  name: '@deepseek-ai/dsh-command-compact'

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
